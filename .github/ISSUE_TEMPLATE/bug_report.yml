name: Bug report
description: Report incorrect, incomplete, duplicated, or failed search behavior
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Remove private source, credentials, and sensitive paths before submitting.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Pi, plugin commit/version, Bun or Node.js, and ripgrep versions
      placeholder: "Pi 0.84.3; plugin abc123; Bun 1.4.0; rg 14.1.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Tool input
      description: Provide the exact signal_grep arguments using a non-sensitive fixture.
      render: json
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include both text and relevant structured details, especially status and snapshotComplete.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands or a small public fixture that reproduce the issue.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed private code, credentials, and sensitive paths.
          required: true
