name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify ripgrep
        run: rg --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run checks
        run: bun run check
      - name: Verify package contents
        run: bun run pack:check

  compatibility:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS / Node 22
            os: macos-14
            node: 22
          - name: Windows / Node 22
            os: windows-latest
            node: 22
          - name: Linux / Node 24
            os: ubuntu-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify ripgrep
        run: rg --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run integration tests
        run: bun test
      - name: Run Node compatibility smoke test
        run: bun run test:node
